name: LuCI Theme Aurora Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build luci-theme-aurora ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        sdk: ["24.10.8", "25.12.5"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: slug
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: eamonxg/build-luci-package@v2
        with:
          sdk: ${{ matrix.sdk }}
          packages: '[{"pkg":"luci-theme-aurora","path":"."}]'

      - uses: actions/upload-artifact@v6
        with:
          name: luci-theme-aurora-${{ steps.slug.outputs.ref }}-${{ matrix.sdk }}-${{ steps.build.outputs.pkg_type }}
          path: out/*.[ai]pk

  release:
    name: release raw packages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.[ai]pk
          generate_release_notes: true
          fail_on_unmatched_files: true
